# In container
ELASTIC_URL: "http://elasticsearch:9200" 
# On local Host
# ELASTIC_URL: "http://localhost:9200"
request_timeout: 60
retry_on_timeout: True
max_retries: 1
http_compress: True
# Connection pooling for cloud
connections_per_node: 10

ES_INDEX: news_articles
CATEGORY_QUERY: 
  size: 0
  query:
    bool:
      should: []                 # filled in code, one match clause per category
      minimum_should_match: 1
  # Kept for later use but removed before sending (helpers/es_helper.category_query):
  # category_search only reads hits.total, and source is a plain keyword field, so
  # source.keyword does not exist under the strict mapping.
  aggs:
    matched_sources:
      terms:
        field: source.keyword
        size: 20

# article_search query template (filled in helpers/es_helper.build_search_query):
# - must: plain lexical multi_match of the user query on title^2 and content.
# - should: boosts documents whose title matches the joined categories (dropped when there are none).
# Semantic search (content.semantic, semantic_text) is not implemented yet.
SEARCH_QUERY_TEMPLATE:
  size: 5
  _source: [article_id]
  query:
    bool:
      must:
        - multi_match:
            query: ""             # filled in code: user query
            fields: ["title^2", "content"]
            minimum_should_match: "2<75%"
      should:
        - multi_match:
            query: ""             # filled in code: expanded category terms
            fields: [title]
            boost: 1.5

issuer_realm: http://keycloak:8180/realms/es-mcp
well_known_uri: /.well-known/openid-configuration
jwks_http_timeout_sec: 5
audience: http://es-mcp-lb:9599/mcp
ARTICLE_CONTENT_MAX_CHARS: 1000
TRUNCATE: True